# Builds the mod ONLY when you start it by hand: Actions tab -> "build" -> "Run workflow".
# This file must live at the REPOSITORY ROOT: .github/workflows/build.yml
# (GitHub ignores workflows in subfolders). The project itself stays in the "whitemist" folder.

name: build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: whitemist
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build --console=plain --stacktrace 2>&1 | tee build.log
      - name: upload jar
        uses: actions/upload-artifact@v7
        with:
          name: whitemist-jar
          path: |
            whitemist/build/libs/*.jar
            !whitemist/build/libs/*-sources.jar
      - name: upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: whitemist/build.log
